name: ani_mart
description: "AniMart - Livestock Marketplace."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2  
  supabase_flutter: ^2.15.0
  http: ^1.2.2
  image_cropper: ^12.2.1
  # Push notifications (plan-sale alerts even when the app is closed).
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  # Opens the seller's Messenger link from a listing.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - images/

  